<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <filter id="blur" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <clipPath id="tile"><rect x="180" y="180" width="640" height="640" rx="150"/></clipPath>
    <!-- the receipt fades out as it sinks into the cloud (no hard edge) -->
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.49" stop-color="#fff"/>
      <stop offset="0.59" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="sink" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1000">
      <rect width="1000" height="1000" fill="url(#fade)"/>
    </mask>
  </defs>

  <rect width="1000" height="1000" fill="#f5f5f4"/>
  <rect x="180" y="180" width="640" height="640" rx="150" fill="#ffffff" filter="url(#shadow)"/>

  <g clip-path="url(#tile)">
    <!-- receipt -->
    <g mask="url(#sink)" stroke="#38383e" stroke-linecap="round" fill="none" stroke-width="10">
      <rect x="367" y="300" width="266" height="330" rx="14" fill="#ffffff"/>
      <line x1="427" y1="354" x2="573" y2="354"/>
      <line x1="402" y1="404" x2="598" y2="404"/>
      <line x1="402" y1="444" x2="528" y2="444"/>
      <line x1="568" y1="444" x2="598" y2="444"/>
      <line x1="402" y1="484" x2="528" y2="484"/>
      <line x1="568" y1="484" x2="598" y2="484"/>
      <line x1="402" y1="524" x2="528" y2="524"/>
      <line x1="568" y1="524" x2="598" y2="524"/>
    </g>

    <!-- colour cloud, kept well inside the tile -->
    <!-- drawn twice: the second pass makes the colours denser and more vivid -->
    <g id="cloud" filter="url(#blur)">
      <circle cx="322" cy="580" r="48" fill="#b13cff"/>
      <circle cx="390" cy="594" r="54" fill="#3f8bff"/>
      <circle cx="450" cy="603" r="50" fill="#1fd0ff"/>
      <circle cx="510" cy="604" r="50" fill="#d4f53a"/>
      <circle cx="568" cy="597" r="51" fill="#ffa62b"/>
      <circle cx="625" cy="588" r="54" fill="#ff3fc8"/>
      <circle cx="685" cy="579" r="46" fill="#9a5cff"/>
      <circle cx="420" cy="552" r="40" fill="#ff5fa8"/>
      <circle cx="590" cy="552" r="40" fill="#c03cff"/>
    </g>
    <use href="#cloud" opacity="0.55"/>
  </g>
</svg>
